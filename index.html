<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МедФарм - Качественные лекарственные препараты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pharma-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <div class="d-flex align-items-center">
                        <div class="logo-icon">
                            <i class="fas fa-capsules"></i>
                        </div>
                        <div>
                            <h1>МедФарм</h1>

                        </div>
                    </div>
                </div>
                <div class="col-md-6 text-md-end text-center mt-3 mt-md-0">
                    <div class="phone-number">
                        <i class="fas fa-phone-alt me-2"></i>
                        <span>8-800-555-35-35</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="root" class="container mt-4"></div>

    <div class="pharma-footer">
        <div class="container">
            <p><i class="fas fa-copyright me-1"></i> 2024 МедФарм — заботимся о вашем здоровье</p>
            <small>Перед применением проконсультируйтесь с врачом</small>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
